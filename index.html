<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAQIN-CODE | Color Palette Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="brand">YAQIN-CODE</div>
      <h1>Color Palette Generator</h1>

      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>

      <div class="palette-container">
        <!-- COLOR BOX 1 -->
        <div class="color-box">
          <div class="color" style="background-color: #2b6777"></div>
          <div class="color-info">
            <span class="hex-value">#2b6777</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 2 -->
        <div class="color-box">
          <div class="color" style="background-color: #c8d8e4"></div>
          <div class="color-info">
            <span class="hex-value">#c8d8e4</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #ffffff"></div>
          <div class="color-info">
            <span class="hex-value">#ffffff</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #f2f2f2"></div>
          <div class="color-info">
            <span class="hex-value">#f2f2f2</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <!-- COLOR BOX 5 -->
        <div class="color-box">
          <div class="color" style="background-color: #52ab98"></div>
          <div class="color-info">
            <span class="hex-value">#52ab98</span>
            <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
